name: Build and Push Model API
 
on:
  push:
    branches: [ "main" ]
 
jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.9
 
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8 pytest
      - name: Lint with flake8
        run: flake8 src/ --count --exit-zero --max-complexity=10 --statistics
 
      # Run preprocess: fetch data + write validation report (no pipeline behavior change)

      - name: Run preprocess (data + validation)
        run: python src/preprocess.py

      # Upload the validation HTML/JSON so you can download from Actions

      - name: Upload validation reports
        uses: actions/upload-artifact@v4

        with:
          name: data-validation-reports
          path: |
            artifacts/validation/**/latest_report.html
            artifacts/validation/**/summary.json

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_PASSWORD}}
 
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/california-housing-api:latest